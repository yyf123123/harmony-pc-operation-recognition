name: Linux adapter

on:
  push:
    branches: [linux]
    paths: ['native/**', 'collector/**', 'scripts/**', 'features/**', 'apps/**', 'classification/**', 'models/**', 'tests/**', 'CMakeLists.txt', 'requirements.txt', '.github/workflows/linux.yml']
  pull_request:
    branches: [main, linux]
    paths: ['native/**', 'collector/**', 'scripts/**', 'features/**', 'apps/**', 'classification/**', 'models/**', 'tests/**', 'CMakeLists.txt', 'requirements.txt', '.github/workflows/linux.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.audit_models
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 2
      - run: ctest --test-dir build/native --output-on-failure
      - run: python -m tests.check_native_errors --native build/native/native/operation_predict --models models
      - run: python -m unittest discover -s tests -v
        env:
          NATIVE_BUILD_DIR: build/native
          LINUX_VMA_COLLECTOR: build/native/collector/linux/linux_vma_collect
